# ===========================================================
# Logstash Pipeline: siem-lab.conf
# Ingests: (1) Filebeat/Beats, (2) TCP syslog, (3) direct file
# ===========================================================

input {
  # --- Input 1: Filebeat agent (ships sample log files) ---
  beats {
    port => 5044
  }

  # --- Input 2: Raw TCP syslog (send via netcat for quick testing) ---
  tcp {
    port => 5000
    codec => plain { charset => "UTF-8" }
    tags => ["tcp_syslog"]
  }
}

# ===========================================================
# FILTER: Normalize & enrich log data
# ===========================================================
filter {

  # ---- Parse Linux syslog format ----
  if [message] =~ /^\w{3}\s+\d+ \d{2}:\d{2}:\d{2}/ {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_host} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      tag_on_failure => ["_grok_failure"]
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # ---- Parse simple Apache/Nginx access log format ----
  if [message] =~ /\d+\.\d+\.\d+\.\d+.*\[.*\]/ {
    grok {
      match => {
        "message" => "%{COMBINEDAPACHELOG}"
      }
      tag_on_failure => ["_grok_failure"]
    }
    mutate {
      convert => {
        "bytes"    => "integer"
        "response" => "integer"
      }
    }
  }

  # ---- Parse Windows Event Log (JSON from Winlogbeat) ----
  if [winlog] {
    mutate {
      add_field => { "log_source" => "windows_event" }
    }
  }

  # ---- Enrich: tag high-severity events ----
  if [syslog_message] =~ /(?i)(failed|error|denied|unauthorized|attack|malware|critical)/ {
    mutate {
      add_tag   => ["security_alert"]
      add_field => { "severity" => "HIGH" }
    }
  }

  # ---- Drop noisy heartbeat/health-check lines ----
  if [message] =~ /healthcheck|kube-probe|ELB-HealthChecker/ {
    drop {}
  }

  # ---- Add lab metadata ----
  mutate {
    add_field => {
      "lab_environment" => "siem-workshop"
      "ingest_pipeline" => "logstash-siem-lab"
    }
  }
}

# ===========================================================
# OUTPUT: Send to Elasticsearch
# ===========================================================
output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "siem-logs-%{+YYYY.MM.dd}"
    # Separate index for security alerts
  }

  # Also print to stdout for debugging (comment out in production)
  stdout {
    codec => rubydebug
  }
}
